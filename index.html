.C{position:absolute;left:606px;top:34px;width:400px;height:400px;border-radius:50%;background:radial-gradient(#050505 55%,#111);border:10px solid #262629;box-shadow:0 0 0 3px #000,0 0 40px #000}

.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>.n{flex:none}

.tg input:after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}.tg input:checked:after{left:18px}
.sw{display:flex;gap:12px;margin:6px 0}.sw i{width:26px;height:26px;border-radius:50%;cursor:pointer;border:3px solid transparent}.sw i.on{border-color:#fff}
.go{background:#18a34a}.pa{background:#e0a100}.rs{background:#d9261c}.bl{background:#1769ff}
.wr{display:grid;grid-template-columns:40px minmax(0,1fr) 22px 22px 22px;gap:3px;align-items:center;margin-bottom:5px}.wr input{min-width:0;font-size:11.5px;padding:6px 6px}.wr input:first-child{width:100%;padding:6px 2px;text-align:center}.wr .btn{padding:7px 0;width:22px;font-size:11px;text-align:center}
.sec{display:none}.sec.on{display:block}.sec.on.grid{display:grid}
body .btn,body .tab,body .seg button,body .p h2,body input,body select,body textarea{font-family:Montserrat,Arial,sans-serif}nav h1{font-family:Oswald,'Arial Narrow',Arial,sans-serif}#L:before{background:linear-gradient(115deg,transparent 93%,var(--a) 93.5% 96.5%,transparent 97%)}.inf{overflow:hidden}

.msg{color:#ffb020;font-size:12px;min-height:16px}.ok{color:#2fd16b}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sc{display:flex;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--ln)}.sc b{flex:1}
</style></head><body>
<div id="app"></div>

/* ---- app ---- */
